[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-cli"
version = "0.1.0"
description = "Terminal agent for GGUF or API models"
requires-python = ">=3.12"
# A local model also needs the llama-server program of llama.cpp on the PATH: see "Installation" in the README.
dependencies = [
    "textual==8.2.8",  # draws the screen and reads the keyboard; the terminal application framework
    "python-dotenv==1.2.4",  # reads the .env file; the parser for the KEY=value format
    "httpx==0.28.1",  # talks to llama-server and to OpenRouter and reads the reply as it arrives; the HTTP client
]

# The command the installation creates: typing agentcli calls main() of the main.py at the project root.
[project.scripts]
agentcli = "main:main"

# Only for working on the code: uv sync installs them, and an installation of the CLI alone does not.
[dependency-groups]
dev = [
    "pytest==9.2.0",  # runs the tests; the test runner
]

# The package, with the stylesheet and the default system prompt inside it, and the main.py at the root.
[tool.hatch.build.targets.wheel]
only-include = ["agent_cli", "main.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
